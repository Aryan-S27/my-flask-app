name: Flask CI
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r "C:\Users\aryan\Aryan\Third_year_engineering\Agile Software development and Devops\experiments\exp7\project\my-flash-app\requirements.txt"
      - name: Run tests
        run: |
          pytest
